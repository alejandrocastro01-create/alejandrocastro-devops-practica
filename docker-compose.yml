services:
  api:
    build: .
    image: alejandrocastrorodriguez/tienda-api:1.1
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: dockerfile.frontend
    image: alejandrocastrorodriguez/tienda-frontend:1.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
